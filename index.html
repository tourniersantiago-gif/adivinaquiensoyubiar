<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131027"><title>¿Quién soy? · Ubiar — Móvil</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#fff;background:#131027;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#3c215c,#16112a 65%);min-height:100dvh}button,select{font:inherit}button{border:none;touch-action:manipulation;cursor:pointer;font-weight:850}button:disabled{opacity:.35}.app{width:min(100%,530px);min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 17px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;color:#cfc0ea;font-size:12px;font-weight:850;letter-spacing:.07em}.chip{padding:8px 12px;border:1px solid #735b92;border-radius:30px}.progress{height:5px;border-radius:5px;background:#46395e;overflow:hidden}.progress i{display:block;background:linear-gradient(90deg,#fe4380,#9a54f2);height:100%;width:0;transition:width .3s}h1{font-size:clamp(25px,7vw,36px);margin:3px 0;text-align:center;letter-spacing:-.05em}h1 span{color:#ff548c}.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border-radius:27px;background:linear-gradient(145deg,#452b6b,#231735);border:1px solid #65487b;text-align:center;position:relative;padding:14px}.portrait{flex:1;min-height:190px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at bottom,#9a66a6,#493264 65%,#352349);position:relative}.portrait img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom}.portrait .symbol{font-weight:950;font-size:clamp(90px,26vw,150px);color:#dcbcfb}.identity{padding:12px 4px 5px;flex-shrink:0;width:100%}.identity h2{font-size:clamp(27px,8vw,42px);line-height:1.08;letter-spacing:-.04em;margin:0}.identity p{color:#d5c2e3;margin:8px 0 0;font-size:14px}.stage.counting{background:radial-gradient(circle,#7630ab,#291639)}.stage.counting .portrait{background:transparent;flex:1}.counter{font-size:clamp(150px,44vw,240px);font-weight:950;line-height:1;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.countHint{font-size:clamp(24px,7vw,36px);font-weight:900;line-height:1.15;padding:0 18px}.countSub{font-size:15px;color:#eed9ff;margin-top:9px}.turnTimer{display:flex;align-items:center;gap:12px;background:#29203d;border:1px solid #685184;border-radius:14px;padding:10px 13px}.turnTimer strong{font-size:25px;font-variant-numeric:tabular-nums;min-width:50px;text-align:right}.turnTimer .track{height:10px;flex:1;background:#514069;border-radius:20px;overflow:hidden}.turnTimer .track i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#fc3a80,#a95cff);transition:width .18s linear}.turnTimer.urgent strong{color:#ff6486}.turnTimer.urgent .track i{background:#ff547e}.controls{display:flex;flex-direction:column;gap:10px}.primary{background:linear-gradient(105deg,#ff397a,#9149ee);color:white;border-radius:17px;padding:19px 12px;font-size:22px;min-height:68px;box-shadow:0 8px 26px #a72f7c55}.secondary{background:#403255;color:#fff;border-radius:13px;padding:14px 12px;font-size:15px}.smallrow{display:flex;justify-content:center;align-items:center;gap:12px;color:#c9badf;font-size:13px}.smallrow select{background:#372947;color:#fff;border:1px solid #6c4b83;padding:7px;border-radius:9px}.foot{text-align:center;color:#9484ab;font-size:11px}.foot a{color:#dbb4ff}.hide{display:none!important}@media(max-height:650px){.app{gap:7px}.stage{padding:8px}.portrait{min-height:145px}.primary{min-height:56px;padding:11px}.identity h2{font-size:25px}.identity{padding:7px}.counter{font-size:120px}}@media(min-width:700px){.app{height:100dvh}}
</style></head><body><main class="app"><div class="top"><span class="chip">UBIAR · ¿QUIÉN SOY?</span><span id="round">0 / 29</span></div><div class="progress"><i id="progress"></i></div><h1>¿QUIÉN <span>SOY?</span></h1><section class="stage" id="stage" aria-live="polite"><div class="portrait" id="portrait"><div class="symbol">?</div></div><div class="identity" id="identity"><h2 id="personName">Pasá el celu</h2><p id="personRole">Colocalo en la frente y empezá a jugar</p></div></section><div class="turnTimer hide" id="turnTimer"><span>⏱ Tiempo</span><div class="track"><i id="timeBar"></i></div><strong id="timeLeft">30s</strong></div><div class="controls"><button id="next" class="primary">▶ Empezar</button><div class="smallrow"><label for="delay">Cuenta regresiva:</label><select id="delay"><option value="3">3 segundos</option><option value="5" selected>5 segundos</option><option value="8">8 segundos</option><option value="10">10 segundos</option></select><button id="restart" class="secondary">↻ Reiniciar</button></div></div><div class="foot">Una persona por turno, sin repeticiones · <a href="https://ubiar.com/nosotros" target="_blank" rel="noopener">Fotos de Ubiar</a></div></main><script>
const root='https://ubiar.com/ubiar_web_2026/static/src/images/nosotros/';
const people=[
['Guido Lusardi','Responsable de implementación','guido.png'],['Patricio Ruscica','COO','patricio.png'],['Iván Grandi','CTO','ivo.png'],['Tomás Del Bianco','Programador','Tomi.png'],['Aldana Gordillo','Asesora Gerencial','aldana.png'],['Rodrigo Benitez','Programador','pancho.png'],['Vanina Vera','Responsable de Administración y RRHH','vani.png'],['Luciano Marcellino','Responsable de Desarrollo','lucho.png'],['Antonela Cuccarolo','Coordinación General','anto.png'],['Verónica Pool','Responsable de Mesa de ayuda','vero.png'],['Laureano Brambilla','Calidad Producto','Laureano.png'],['Luciana Silvestre','Implementación','luchi.png'],['Nicolás Mola','Técnico de Infraestructura','nico.png'],['Marcelo Peirone','Implementación','marce.png'],['Paola Azar','Implementación','Pao.png'],['Rocío Pizzio','Administración','rocio.png'],['Sebastián Cámara','Programador','seba.png'],['David Mazurco','Ejecutivo Ventas Headway','David.png'],['Adriano Scozziero','Implementación','adriano.png'],['Felipe Batista','Programador','Felipe.png'],['Joselina Picco','Calidad de Producto','Jose.png'],['Agustina Pellicciotti','Mesa de Ayuda','Agus.png'],['Jean Sainte','Programador','jean.png'],['Carlos Vinciguerra','Mesa de Ayuda','Charly.png'],['Camila Morlachetti','Calidad de Procesos','Cami.png'],['Santiago Tournier','Ejecutivo de Ventas & Analista de Marketing','santi.png'],['Antonella Rodríguez','Implementación','antonella.png'],['Mayra Nannini','Mesa de Ayuda','mayra.png'],['Gonzalo Zinni','Mesa de Ayuda','gonza.png']];
let deck=[],idx=-1,interval=null,turnInterval=null,turnDeadline=0,isCounting=false;const el=id=>document.getElementById(id);const stage=el('stage');
function shuffle(){deck=people.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function stopTurn(){clearInterval(turnInterval);turnInterval=null;el('turnTimer').classList.add('hide');el('turnTimer').classList.remove('urgent')}
function reset(){stopTurn();clearInterval(interval);interval=null;isCounting=false;shuffle();idx=-1;stage.classList.remove('counting');el('portrait').innerHTML='<div class="symbol">?</div>';el('identity').classList.remove('hide');el('personName').textContent='Pasá el celu';el('personRole').textContent='Colocalo en la frente y empezá a jugar';el('next').disabled=false;el('next').textContent='▶ Empezar';el('round').textContent='0 / '+people.length;el('progress').style.width='0%'}
function display(){isCounting=false;stage.classList.remove('counting');const p=people[deck[idx]];const pic=el('portrait');pic.replaceChildren();const img=new Image();img.alt='Foto de '+p[0];img.src=root+p[2];img.onerror=()=>{pic.innerHTML='<div class="symbol">?</div>'};pic.append(img);el('identity').classList.remove('hide');el('personName').textContent=p[0];el('personRole').textContent=p[1];el('round').textContent=(idx+1)+' / '+people.length;el('progress').style.width=(100*(idx+1)/people.length)+'%';el('next').disabled=false;el('next').textContent=idx===people.length-1?'✓ Terminar ronda':'↪ Siguiente persona';startTurn()}
function startTurn(){stopTurn();let left=30;turnDeadline=Date.now()+30000;el('turnTimer').classList.remove('hide');function tick(){left=Math.max(0,Math.ceil((turnDeadline-Date.now())/1000));el('timeLeft').textContent=left+'s';el('timeBar').style.width=(left/30*100)+'%';el('turnTimer').classList.toggle('urgent',left<=10);if(left===0){clearInterval(turnInterval);turnInterval=null;el('portrait').innerHTML='<div class="symbol">⏰</div>';el('personName').textContent='¡Tiempo terminado!';el('personRole').textContent='Pasale el celular al siguiente jugador';el('next').textContent=idx===people.length-1?'✓ Terminar ronda':'↪ Siguiente persona'}}tick();turnInterval=setInterval(tick,100)}
function countdown(){stopTurn();isCounting=true;el('next').disabled=true;el('identity').classList.add('hide');stage.classList.add('counting');let remaining=Number(el('delay').value);const pic=el('portrait');function render(){pic.innerHTML='<div><div class="countHint">¡Celu a la frente!</div><div class="counter">'+remaining+'</div><div class="countSub">Preparando la próxima persona…</div></div>'}render();interval=setInterval(()=>{remaining--;if(remaining<=0){clearInterval(interval);interval=null;display()}else render()},1000)}
function advance(){if(isCounting)return;stopTurn();if(idx>=people.length-1){stage.classList.remove('counting');el('portrait').innerHTML='<div class="symbol">🏆</div>';el('identity').classList.remove('hide');el('personName').textContent='¡Ronda completa!';el('personRole').textContent='Salieron las '+people.length+' personas sin repetir';el('next').textContent='↻ Jugar de nuevo';idx=people.length;return}if(idx===people.length){reset();return}idx++;countdown()}
el('next').addEventListener('click',()=>{if(idx===people.length){reset();return}advance()});el('restart').addEventListener('click',reset);reset();
</script></body></html>
